name: Vibe Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  vibe-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          
      - name: Create Mock Venv (for sync script compatibility)
        run: |
          mkdir -p venv/bin
          ln -s $(which ruff) venv/bin/ruff
          ln -s $(which mypy) venv/bin/mypy
          ln -s $(which pytest) venv/bin/pytest
          ln -s $(which python) venv/bin/python
          
      - name: Run Vibe Sync
        run: ./scripts/sync.sh
