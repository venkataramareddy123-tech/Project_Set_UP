description = "Sync to the current repository state and plan the next implementation step."
prompt = "Resolve the repository from the directory where the current agent session started. Read that repository's ARCHITECTURE.md, docs/CONTEXT.md, docs/ROADMAP.md, and docs/REPO_MAP.md. Treat ARCHITECTURE.md as the big-picture source of intent, then derive work downward into roadmap, active task, and concrete implementation steps. Identify the current milestone, latest handoff context, and next unchecked roadmap task for that repository only. Summarize where work stopped and produce a short, concrete implementation plan for the next task instead of executing it by default. If the user explicitly asks to continue building in the same turn, execute the planned task using the repository workflow rules."
