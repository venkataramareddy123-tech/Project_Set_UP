name: 🌊 Vibe Check (Quality Gate)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest coverage

      - name: 🛠️ Mock Environment for scripts
        run: |
          mkdir -p venv/bin
          ln -s $(which ruff) venv/bin/ruff
          ln -s $(which mypy) venv/bin/mypy
          ln -s $(which pytest) venv/bin/pytest
          ln -s $(which python) venv/bin/python
          chmod +x scripts/*.sh

      - name: 🛑 Run Strict Quality Gate
        run: ./scripts/check.sh --ci

      - name: 🚀 Bootstrap Smoke Test
        run: |
          mkdir -p ../temp_project
          cp -r . ../temp_project/
          cd ../temp_project
          ./scripts/bootstrap.sh --name "TestProject" --description "Test Description" --profile cli --yes
          
          # Verify critical files still exist
          test -f scripts/sync.sh
          test -f docs/ROADMAP.md
          test -f docs/AGENT_CONTRACT.md
          test -f src/testproject/cli.py
          test -f scripts/snapshot_workspace.py
          
          # Verify sync still runs (it might fail if venv is missing, but scripts should exist)
          ./scripts/check.sh --ci || true
